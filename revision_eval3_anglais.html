<title>Révision éval 3 d’anglais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: one 46rem study column under a sticky tab bar; only the live card / question is raised. */
  --bg:#0c141e;
  --surface:#131e2a;
  --raised:#1b2937;
  --line:#2b3c4e;
  --fg:#e6edf4;
  --muted:#95a7b9;
  --accent:#86bfdc;          /* ceil blue, the colour of surgical scrubs */
  --accent-2:#b7d9eb;
  --on-accent:#08141d;
  --good:#5cc995; --good-bg:rgba(92,201,149,.13);
  --bad:#f38a83;  --bad-bg:rgba(243,138,131,.13);
  --warn:#eab95a; --warn-bg:rgba(234,185,90,.14);
  --shadow:0 14px 34px rgba(0,0,0,.38);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tabs-h:58px;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f5f8; --surface:#ffffff; --raised:#e8eff5; --line:#cddae4; --fg:#122130; --muted:#53677a;
    --accent:#1b6890; --accent-2:#124e6d; --on-accent:#ffffff;
    --good:#16804e; --good-bg:rgba(22,128,78,.10); --bad:#b8392f; --bad-bg:rgba(184,57,47,.09); --warn:#8a5a03; --warn-bg:rgba(138,90,3,.10);
    --shadow:0 10px 26px rgba(18,33,48,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f5f8; --surface:#ffffff; --raised:#e8eff5; --line:#cddae4; --fg:#122130; --muted:#53677a;
  --accent:#1b6890; --accent-2:#124e6d; --on-accent:#ffffff;
  --good:#16804e; --good-bg:rgba(22,128,78,.10); --bad:#b8392f; --bad-bg:rgba(184,57,47,.09); --warn:#8a5a03; --warn-bg:rgba(138,90,3,.10);
  --shadow:0 10px 26px rgba(18,33,48,.10);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:46rem;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr);padding-block:22px 80px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
b,strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- header ---------- */
.hero{display:grid;gap:12px;padding-block:6px 18px}
.eyebrow{font:600 .74rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(1.75rem,5.4vw,2.5rem)}
.scope{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.scope li{font-size:.86rem;padding:.28rem .62rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.method{font-size:.9rem;color:var(--muted)}
.method b{color:var(--fg)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:calc(var(--gl) - 4px);padding-right:calc(var(--gr) - 4px);height:var(--tabs-h);align-items:flex-end}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:.7rem .85rem .78rem;font-weight:700;font-size:.97rem;color:var(--muted);border-bottom:3px solid transparent;border-radius:0}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.panel{padding-top:20px;display:grid;gap:16px}
.panel>*,.q-card>*,.score-card>*,.ex-sec>*,.eq>*{min-width:0}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:10px;padding:.68rem 1rem;font-weight:700;font-size:.95rem;line-height:1.2;display:inline-flex;align-items:center;gap:.45rem;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{background:var(--accent-2)}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.pg{font:600 .72rem/1 var(--f-mono);letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.25rem .4rem;white-space:nowrap}
.term{font-family:var(--f-mono);font-weight:600;font-size:1.25em}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);margin-inline:.15em;transform:translateY(-.15em)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .8rem;font-size:.9rem;font-weight:700;display:inline-flex;gap:.5rem;align-items:baseline}
.chip .n{font:600 .74rem var(--f-mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip[aria-pressed="true"] .n{color:var(--on-accent);opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.5rem .8rem;font-size:.88rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.bar{height:6px;border-radius:99px;background:var(--raised);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.kbd{font:500 .78rem var(--f-mono);color:var(--muted)}
.stat{font:600 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- flashcards ---------- */
.decks{display:flex;flex-wrap:wrap;gap:8px}
.fc-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fc{perspective:1400px;cursor:pointer;outline:none}
.fc-inner{display:grid;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;min-height:15rem;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--raised)}
.fc:focus-visible .face{outline:3px solid var(--accent);outline-offset:2px}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc-tag{font:600 .72rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.fc-q{font-size:1.28rem;line-height:1.4;flex:1;display:flex;align-items:center}
.fc-a{font-family:var(--f-display);font-weight:800;font-size:1.65rem;line-height:1.15}
.fc-sub{font-size:1.02rem}
.fc-note{font-size:.92rem;color:var(--muted)}
.fc-hint{font-size:.8rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-actions .btn{padding:.9rem 1rem;font-size:1rem}
.fc-progress{display:flex;align-items:center;gap:12px}

/* ---------- exercises ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:10px}
.ex-group{display:grid;gap:10px}
.ex-group h2{font-size:1.05rem;color:var(--muted);font-family:var(--f-mono);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:6px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .t{font-weight:700;font-size:1rem;line-height:1.3}
.tile .d{font-size:.86rem;color:var(--muted)}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.fmt{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:.2rem .45rem;border-radius:6px;background:var(--raised);color:var(--muted)}
.best{font:600 .78rem var(--f-mono);color:var(--good)}
.q-card{display:grid;gap:14px}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-label{font:600 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.q-text{font-size:1.22rem;line-height:1.45}
.q-hint{font-size:.92rem;color:var(--muted)}
.q-hint b{color:var(--fg)}
.inp{width:100%;font:500 1.12rem var(--f-body);padding:.78rem .9rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
textarea.inp{min-height:5.2rem;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);outline:none}
#qForm{flex-wrap:nowrap}
#qForm .inp{flex:1 1 auto;min-width:0;width:100%}
#qForm .btn{flex:0 0 auto}
.inp.ok{border-color:var(--good)} .inp.ko{border-color:var(--bad)} .inp.near{border-color:var(--warn)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:8px}
.opts.long{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--raised);border-radius:10px;padding:.8rem .7rem;font-weight:700;font-size:1rem;text-align:center}
.opts.long .opt{text-align:left;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:.98rem}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.ko{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.near{background:var(--warn-bg);border:1px solid var(--warn)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--good)} .fb.ko .h{color:var(--bad)} .fb.near .h{color:var(--warn)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:.84rem;padding:.25rem .55rem;border-radius:999px;border:1px solid var(--line)}
.key.y{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.key.n{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.model{font-size:1.04rem}
.model li{margin-block:2px}
.review{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.review li{border-left:3px solid var(--bad);padding:.35rem .7rem;background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem}
.review li .ans{color:var(--good);font-weight:700}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}

/* ---------- exam ---------- */
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabs-h));z-index:15;background:var(--bg);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-block:10px;padding-left:var(--gl);padding-right:var(--gr);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font:600 1.5rem var(--f-mono);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad)}
.ex-sec{display:grid;gap:12px}
.ex-sec h2{font-size:1.12rem}
.ex-sec h2 .pts{font:600 .78rem var(--f-mono);color:var(--muted);margin-left:.4rem}
.eq{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.eq label{display:flex;gap:.6rem;font-size:1.04rem;line-height:1.45}
.eq .num{font:600 .9rem var(--f-mono);color:var(--muted);min-width:1.6rem}
.eq.ok{border-color:var(--good)} .eq.ko{border-color:var(--bad)}
.eq .corr{font-size:.95rem}
.eq .corr .ans{color:var(--good);font-weight:700}
.grade3{display:flex;gap:6px;flex-wrap:wrap}
.grade3 button{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:.45rem .7rem;font-weight:700;font-size:.88rem}
.grade3 button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.score-card{display:grid;gap:10px}
.score-row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}

/* ---------- fiches ---------- */
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.86rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.3rem .65rem;color:var(--fg);background:var(--surface)}
.sheet{display:grid;gap:12px;scroll-margin-top:calc(var(--tabs-h) + 12px)}
.sheet h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rule{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rule .k{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--accent)}
.rule ul{margin:0;padding-left:1.1rem;display:grid;gap:4px}
.ex-line{font-style:italic}
.warnbox{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.warnbox h3{color:var(--warn)}
.warnbox ul{margin:0;padding-left:1.1rem;display:grid;gap:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:.55rem .7rem;border-bottom:1px solid var(--line)}
th{font:600 .74rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--raised)}
tr:last-child td{border-bottom:0}
td.w{font-weight:700;white-space:nowrap}
td.end{font-family:var(--f-mono);white-space:nowrap}
.qtable td,.qtable th{text-align:center}
.qtable td:first-child,.qtable th:first-child{text-align:left}
.qtable td b{font-family:var(--f-display);font-size:1.05rem}

@media (max-width:640px){
  .decks{flex-wrap:nowrap;overflow-x:auto;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);padding-bottom:2px;scrollbar-width:none}
  .decks::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
}
@media (max-width:520px){
  .tabs{gap:0;justify-content:space-between;padding-left:calc(var(--gl) - 8px);padding-right:calc(var(--gr) - 8px)}
  .tab{padding:.65rem .45rem .72rem;font-size:.9rem}
  .kbd{display:none}
  .hero{gap:10px}
  .scope li{font-size:.8rem}
  .fc-q{font-size:1.14rem}
  .fc-a{font-size:1.45rem}
  .q-text{font-size:1.1rem}
  .face{min-height:13.5rem;padding:18px 16px 16px}
}
@media (prefers-reduced-motion: reduce){
  .fc-inner{transition:none}
  .bar i{transition:none}
}
/* ---------- eval 3 additions ---------- */
.scale{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.scale-track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--warn) 55%,var(--bad));margin:28px 6px 34px}
.scale-pt{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--fg);border:3px solid var(--surface)}
.scale-lab{position:absolute;bottom:16px;transform:translateX(-50%);font:800 .95rem var(--f-display);white-space:nowrap}
.scale-sub{position:absolute;top:16px;transform:translateX(-50%);font:600 .74rem var(--f-mono);color:var(--muted);white-space:nowrap}
.scale-ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair>*{min-width:0}
.vs{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:grid;gap:4px}
.vs .k{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.vs.good{border-color:var(--good)} .vs.good .k{color:var(--good)}
.vs.bad{border-color:var(--bad)} .vs.bad .k{color:var(--bad)}
.tf{font:700 .78rem var(--f-mono);padding:.15rem .45rem;border-radius:6px;white-space:nowrap}
.tf.t{color:var(--good);background:var(--good-bg)} .tf.f{color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){ .pair{grid-template-columns:1fr} .scale-sub{font-size:.66rem} }
</style>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Anglais dentaire · Éval 3 · 15–20 min</p>
    <h1>Révision éval 3 d’anglais</h1>
    <ul class="scope" aria-label="Programme de l’éval">
      <li><b>Vocabulaire</b> p.25 → 35</li>
      <li>Point 4 : THE MODALS</li>
      <li>Point 5 : LES INTERROGATIFS</li>
    </ul>
    <p class="method"><b>Méthode :</b> fiches (10 min) → flashcards jusqu’à tout savoir → exercices → examen blanc chronométré → refais tes erreurs.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Modes de révision">
    <button class="tab" role="tab" id="tab-flash" aria-controls="panel-flash" aria-selected="true">Flashcards</button>
    <button class="tab" role="tab" id="tab-ex" aria-controls="panel-ex" aria-selected="false" tabindex="-1">Exercices</button>
    <button class="tab" role="tab" id="tab-exam" aria-controls="panel-exam" aria-selected="false" tabindex="-1">Examen blanc</button>
    <button class="tab" role="tab" id="tab-fiches" aria-controls="panel-fiches" aria-selected="false" tabindex="-1">Fiches</button>
  </nav>

  <main>
    <section class="panel" id="panel-flash" role="tabpanel" aria-labelledby="tab-flash">
      <div class="decks" id="decks" role="group" aria-label="Paquets de cartes"></div>
      <div class="fc-tools">
        <div class="seg" id="dirSeg" role="group" aria-label="Sens des cartes"></div>
        <div class="row">
          <button class="btn ghost" id="fcShuffle" aria-pressed="true">Mélanger : oui</button>
          <button class="btn ghost" id="fcRestart">Recommencer</button>
        </div>
      </div>
      <div id="fcStage"></div>
    </section>

    <section class="panel" id="panel-ex" role="tabpanel" aria-labelledby="tab-ex" hidden>
      <div id="exHome" class="panel" style="padding-top:0"></div>
      <div id="exRun" hidden></div>
    </section>

    <section class="panel" id="panel-exam" role="tabpanel" aria-labelledby="tab-exam" hidden>
      <div id="examIntro"></div>
      <div id="examRes" hidden></div>
      <div id="examRun" hidden></div>
    </section>

    <section class="panel" id="panel-fiches" role="tabpanel" aria-labelledby="tab-fiches" hidden>
      <div id="fichesBody" class="panel" style="padding-top:0"></div>
    </section>
  </main>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   1. UTILITAIRES
   ========================================================= */
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(arr, n) { return shuffle(arr).slice(0, n); }

function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  var prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {

}

function grade(user, answers, opts) {
  opts = opts || {};
  var u = squash(user, opts.articles);
  if (!u) return { r: 'empty' };
  for (var i = 0; i < answers.length; i++) if (squash(answers[i], opts.articles) === u) return { r: 'ok' };
  if (opts.near) {

    var best = Infinity;
    answers.forEach(function (a) { best = Math.min(best, lev(u, squash(a, opts.articles))); });
    var L = squash(answers[0], opts.articles).length;
    if (best <= (L >= 8 ? 2 : 1)) return { r: 'near' };
  }
  return { r: 'ko' };
}

}
function exQuit() { run = null; $('#exRun').hidden = true; $('#exHome').hidden = false; renderExHome(); }

function promptHtml(it) {

  var cls = it.big ? ' term' : '';

function renderQ() {

    body = '<form id="qForm" class="row" autocomplete="off">' +
      '<input class="inp" id="qIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ta réponse…" aria-label="Ta réponse">' +
      '<button class="btn primary" id="qGo" type="submit">Vérifier</button></form>';
  } else if (it.kind === 'choice') {
    body = '<div class="opts' + (it.long ? ' long' : '') + '" role="group" aria-label="Choix">' + it.options.map(function (o, k) { return '<button class="opt" data-k="' + k + '">' + esc(o) + '</button>'; }).join('') + '</div>';
  } else {
    body = '<textarea class="inp" id="qIn" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="' + esc(it.ph || 'Écris ta traduction en anglais…') + '" aria-label="Ta réponse"></textarea>' +

      '<div class="bar"><i style="width:' + Math.round(100 * run.i / n) + '%"></i></div>' +
      '<div class="q-head"><span class="q-label">' + esc(it.label) + '</span>' + (it.src ? '<span class="pg">' + esc(it.src) + '</span>' : '') + '</div>' +

    $('#qForm').addEventListener('submit', function (e) { e.preventDefault(); if (run.answered) nextQ(); else checkType(it); });
    setTimeout(function () { var x = $('#qIn'); if (x) x.focus(); }, 30);
  } else if (it.kind === 'choice') {
    $$('.opt', $('#exRun')).forEach(function (b) { b.addEventListener('click', function () { if (!run.answered) checkChoice(it, +b.getAttribute('data-k')); }); });

    $('#qReveal').addEventListener('click', function () { revealTrans(it); });

}
function fmtScore(s) { return (Math.round(s * 2) / 2).toString().replace('.', ','); }
function nextBtn() { return '<div class="row"><button class="btn primary" id="qNext">' + (run.i + 1 < run.items.length ? 'Suivant →' : 'Voir mon score') + '</button></div>'; }
function bindNext() { var b = $('#qNext'); if (b) { b.addEventListener('click', nextQ); setTimeout(function () { b.focus({ preventScroll: true }); }, 20); } }
function feedbackHtml(res, it) {
  var cls = res.r === 'ok' ? 'ok' : (res.r === 'near' ? 'near' : 'ko');
  var head = res.r === 'ok' ? '✓ Juste' : res.r === 'near' ? '≈ Presque : vérifie l’orthographe' : res.r === 'empty' ? '✗ Pas de réponse' : '✗ Faux';
  var lines = '';
  var also = (it.answers || []).slice(1).filter(function (a) { var q = squash(a, true); return q !== squash(it.answers[0], true) && q !== squash(it.best, true); });
  if (res.r !== 'ok' || also.length) lines += '<div>Réponse : <b>' + esc(it.best) + '</b>' + (also.length ? ' <span class="muted small">(accepté aussi : ' + esc(also.join(', ')) + ')</span>' : '') + '</div>';
  if (res.other) lines += '<div class="small">Ce mot existe dans le cours, mais il ne correspond pas ici.</div>';
  if (it.fr && it.kind === 'type' && !it.blank) lines += '<div class="small">Français : ' + esc(it.fr) + '</div>';
  if (it.why) lines += '<div class="small">' + esc(it.why) + '</div>';
  if (it.note) lines += '<div class="small muted">' + esc(it.note) + '</div>';

}
function checkType(it) {
  var inp = $('#qIn'), v = inp.value;

  run.answered = true;
  inp.classList.add(res.r === 'ok' ? 'ok' : res.r === 'near' ? 'near' : 'ko');
  inp.readOnly = true;
  if (res.r === 'ok') run.score++; else run.wrong.push({ it: it, given: v });
  $('#qGo').textContent = run.i + 1 < run.items.length ? 'Suivant →' : 'Voir mon score';
  $('#qFb').innerHTML = feedbackHtml(res, it);

}
function checkChoice(it, k) {
  run.answered = true;

  $$('.opt', $('#exRun')).forEach(function (b, j) {
    b.disabled = true;
    if (it.options[j] === it.correct) b.classList.add('right');
    else if (j === k) b.classList.add('wrong');
  });
  if (ok) run.score++; else run.wrong.push({ it: it, given: chosen });
  var resHtml = '<div class="fb ' + (ok ? 'ok' : 'ko') + '"><span class="h">' + (ok ? '✓ Juste' : '✗ Faux : ' + esc(it.correct)) + '</span>' + (it.why ? '<div class="small">' + esc(it.why) + '</div>' : '') + '</div>';

function revealTrans(it) {

  var checks = v.trim() ? keyChecks(v, it.keys) : [];
  var keysHtml = checks.length ? '<div class="keys">' + checks.map(function (c) { return '<span class="key ' + (c.ok ? 'y' : 'n') + '">' + (c.ok ? '✓ ' : '✗ ') + esc(c.label) + '</span>'; }).join('') + '</div>' : '';
  $('#qReveal').parentNode.remove();
  $('#qFb').innerHTML = '<div class="fb ' + (checks.length && checks.every(function (c) { return c.ok; }) ? 'ok' : 'near') + '"><span class="h">Corrigé</span><ul class="model">' +
    it.model.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' + (checks.length ? '<div class="small">Points clés repérés dans ta phrase :</div>' + keysHtml : '') +
    '<div class="small">' + esc(it.why) + '</div></div>' +
    '<p class="small muted">Compare honnêtement avec le corrigé :</p><div class="row"><button class="btn good" data-s="1">✓ J’avais juste</button><button class="btn" data-s="0.5">≈ À moitié</button><button class="btn bad" data-s="0">✗ À revoir</button></div>';
  $$('[data-s]', $('#qFb')).forEach(function (b) {
    b.addEventListener('click', function () {
      var s = +b.getAttribute('data-s');

      nextQ();

function nextQ() {
  run.i++;
  if (run.i < run.items.length) renderQ(); else renderExEnd();
}
function answerText(it) { return it.kind === 'type' ? it.best : it.kind === 'choice' ? it.correct : it.model[0]; }
function promptText(it) { var t = it.html ? it.q.replace(/<[^>]+>/g, '') : it.q; return t.replace(/_{3,}/g, '___'); }
function renderExEnd() {
  var n = run.items.length, pct = Math.round(100 * run.score / n);
  if (bests[run.ex.id] == null || pct > bests[run.ex.id]) { bests[run.ex.id] = pct; store.set('best', bests); }
  var m = run.wrong.length;
  $('#exRun').innerHTML = '<div class="card score-card"><h2>' + esc(run.ex.title) + '</h2>' +
    '<div class="score-row"><span class="big">' + fmtScore(run.score) + '/' + n + '</span><span class="muted">' + pct + ' %' + (pct >= 85 ? ' · prêt pour l’éval sur ce point' : pct >= 60 ? ' · encore un tour' : ' · relis la fiche puis recommence') + '</span></div>' +
    (m ? '<h3>Tes erreurs</h3><ul class="review">' + run.wrong.map(function (w) { return '<li>' + esc(promptText(w.it)) + ' → <span class="ans">' + esc(answerText(w.it)) + '</span>' + (w.given ? ' <span class="muted small">(toi : ' + esc(w.given) + ')</span>' : '') + '</li>'; }).join('') + '</ul>' : '<p>Aucune erreur.</p>') +
    '<div class="row">' + (m ? '<button class="btn primary" id="exRetryWrong">Refaire mes ' + m + ' erreurs</button>' : '') + '<button class="btn" id="exRetry">Recommencer (mélangé)</button><button class="btn ghost" id="exBack">← Exercices</button></div></div>';
  if (m) $('#exRetryWrong').addEventListener('click', function () { exStart(run.ex.id, shuffle(run.wrong.map(function (w) { return w.it; }))); });
  $('#exRetry').addEventListener('click', function () { exStart(run.ex.id); });
  $('#exBack').addEventListener('click', exQuit);

  $('#examGo').addEventListener('click', examStart);

function examBuild() {
  var A = pick(VOC, 4).map(function (x) { return qVoc(x); })
    .concat(pick(DISEASES, 1).map(qDis), pick(DENTVOC, 2).map(function (x) { return qVoc(x); }), pick(FORMS.concat(TYPES), 1).map(function (x) { return qVoc(x); }));
  var B = pick(PLURALS, 4).concat(pick(PLURALS_REVIEW, 1)).map(function (p) { return qPlural(p); });
  var C = pick(EQUIV, 4).map(qEquivRand);
  var D = pick(MOD_PROB, 2).map(function (x) { return qFill(x, 'MUST / MAY / MIGHT'); })
    .concat(pick(MOD_FILL, 4).map(function (x) { return qFill(x, 'Modal'); }));
  var E = pick(QW_MCQ, 5).map(function (x) { return qFill(x, 'Interrogatif'); });
  var tr = function (g, n) { return pick(TRANS.filter(function (t) { return t.g === g; }), n).map(qTrans); };
  var F = tr('mod', 1).concat(pick(MOD_REPH, 1).map(qReph), tr('qw', 2));
  return [
    { k: 'A', t: 'Vocabulaire : trouve le mot qui correspond à la définition', items: A, pts: 1 },
    { k: 'B', t: 'Donne le singulier ou le pluriel', items: B, pts: 1 },
    { k: 'C', t: 'Donne l’équivalent scientifique ou courant', items: C, pts: 1 },
    { k: 'D', t: 'Complète avec un modal', items: D, pts: 1 },
    { k: 'E', t: 'Complète avec le bon mot interrogatif', items: E, pts: 1 },
    { k: 'F', t: 'Traduis en anglais (ou reformule avec un modal)', items: F, pts: 2 }
  ];
}
function examStart() {
  exam = { secs: examBuild(), end: Date.now() + EXAM_MIN * 60 * 1000, start: Date.now(), timer: null, done: false };
  var num = 0;
  var html = '<div class="timerbar"><span class="clock" id="clock" aria-live="off">20:00</span><button class="btn primary" id="examSubmit">Rendre ma copie</button></div><div class="panel" style="padding-top:12px">';
  exam.secs.forEach(function (sec) {
    var max = sec.items.length * sec.pts;
    html += '<section class="ex-sec"><h2>' + sec.k + '. ' + esc(sec.t) + '<span class="pts">/ ' + max + '</span></h2>';
    sec.items.forEach(function (it) {

        (it.meta ? '<br><span class="muted small">' + esc(it.meta) + '</span>' : '') +
        (it.fr && it.blank ? '<br><span class="muted small">« ' + esc(it.fr) + ' »</span>' : '');
      var qtxt = it.html ? it.q : ((it.blank || /_{3}/.test(it.q)) ? blankify(it.q) : esc(it.q));
      var lead = (it.kind === 'trans' || it.label === 'Définition → mot') ? '' : '<span class="muted small">' + esc(it.label) + ' : </span>';
      html += '<div class="eq" id="box-' + it.id + '"><label for="' + it.id + '"><span class="num">' + num + '.</span><span>' + lead + qtxt + hint + '</span></label>' +
        (it.kind === 'trans' ? '<textarea class="inp" id="' + it.id + '" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>'
          : '<input class="inp" id="' + it.id + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">') +

function tick() {
  if (!exam || exam.done) return;
  var left = Math.max(0, Math.round((exam.end - Date.now()) / 1000));
  var c = $('#clock'); if (!c) return;
  c.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
  c.className = 'clock' + (left <= 60 ? ' bad' : left <= 300 ? ' warn' : '');

var askTimer = null;
function examAskSubmit(e) {

function examSubmit(auto) {

          (checks.length ? '<div class="keys">' + checks.map(function (c) { return '<span class="key ' + (c.ok ? 'y' : 'n') + '">' + (c.ok ? '✓ ' : '✗ ') + esc(c.label) + '</span>'; }).join('') + '</div>' : '<div class="small">Pas de réponse.</div>') +
          '<div class="small">' + esc(it.why) + '</div><div class="small">Ta note pour cette phrase :</div>' +
          '<div class="grade3" data-q="' + it.id + '"><button data-v="0" aria-pressed="false">0 · faux</button><button data-v="1" aria-pressed="false">1 · à moitié</button><button data-v="2" aria-pressed="false">2 · juste</button></div></div>';

  h += '<div class="sheet warnbox" id="f-pieges"><h3>Les pièges qui coûtent des points</h3><ul>' +
    '<li>Modal + <b>base verbale</b> : pas de TO, pas de -S. <i>She can swim · You must wear gloves</i> (jamais <i>must to</i>, <i>cans</i>). Exceptions : ought <b>to</b>, have <b>to</b>.</li>' +
    '<li><b>MUSTN’T</b> = c’est interdit ≠ <b>DON’T HAVE TO</b> = tu n’es pas obligé.</li>' +
    '<li>MUST n’a ni passé ni futur : <b>had to</b>, <b>will have to</b>. CAN au futur : <b>will be able to</b>. Jamais <i>will must</i>, <i>will can</i>.</li>' +
    '<li>Probabilité au passé : MUST / MAY / MIGHT + <b>HAVE + participe passé</b> (<i>He must have forgotten</i>). Reproche : <b>should have</b> + participe passé (= aurais dû).</li>' +
    '<li><b>WHOSE</b> (à qui) ≠ <b>WHO’S</b> (= who is). <b>HOW LONG</b> = durée ≠ <b>HOW OFTEN</b> = fréquence.</li>' +
    '<li><b>HOW MUCH</b> + indénombrable (sugar) · <b>HOW MANY</b> + pluriel (teeth). La préposition va <b>à la fin</b> : <i>Who are you talking to?</i></li>' +
    '<li><b>rubella</b> = rubéole (German measles) ≠ <b>rubeola</b> = rougeole (measles). Les antibiotiques n’agissent <b>pas</b> sur les virus.</li>' +
    '<li><b>virus → viruses</b>, sinus → sinuses (jamais viri) · <b>apex → apices</b> · <b>gingiva → gingivae</b> · tooth → teeth.</li>' +
    '<li>UK : <b>chemist</b> = pharmacien, <b>the chemist’s</b> = la pharmacie · US : chemist = chimiste seulement. <b>OTC</b> = sans ordonnance.</li></ul></div>';

  h += '<section class="sheet" id="f-mod"><h2>THE MODALS <span class="pg">Point 4 · p.90–95</span></h2>' +
    tbl(['Modal', 'Sens', 'Exemple'], [
      trow(td('MUST', 'w'), td('devoir : obligation forte · certitude (déduction)'), td('<i>You must wear gloves.</i> · <i>He must have an abscess.</i>')),
      trow(td('MAY', 'w'), td('permission (formelle) · possibilité ≈ 50 %'), td('<i>May I come in?</i> · <i>It may be due to low blood pressure.</i>')),
      trow(td('MIGHT', 'w'), td('possibilité plus faible'), td('<i>The infection might be resistant.</i>')),
      trow(td('CAN', 'w'), td('pouvoir, savoir (capacité) · permission'), td('<i>Dentists can diagnose oral diseases.</i>')),
      trow(td('COULD', 'w'), td('passé de can · demande plus polie'), td('<i>They could use amalgam.</i> · <i>Could you open your mouth?</i>')),
      trow(td('SHOULD<br>OUGHT TO', 'w'), td('conseil (= devrait)'), td('<i>You should floss every day.</i> · <i>You ought to see a dentist.</i>'))
    ]) +
    '<div class="rule"><span class="k">Construction</span><ul><li>Modal + <b>base verbale</b>, invariable : <i>She can speak English.</i> (pas de -s, pas de to)</li>' +
    '<li>Négation : <i>must not (mustn’t), cannot (can’t), should not (shouldn’t)</i> · Question : modal devant le sujet, sans DO : <i>Can you help me?</i></li></ul></div>' +
    '<div class="scale" role="img" aria-label="Degré de certitude : MUST environ 90 pour cent, MAY environ 50 pour cent, MIGHT environ 30 pour cent">' +
      '<h3>Probabilité : à quel point tu es sûr ?</h3>' +
      '<div class="scale-track">' +
        '<span class="scale-pt" style="left:10%"></span><span class="scale-lab" style="left:10%">MUST</span><span class="scale-sub" style="left:10%">≈ 90 %</span>' +
        '<span class="scale-pt" style="left:50%"></span><span class="scale-lab" style="left:50%">MAY</span><span class="scale-sub" style="left:50%">≈ 50 %</span>' +
        '<span class="scale-pt" style="left:72%"></span><span class="scale-lab" style="left:72%">MIGHT</span><span class="scale-sub" style="left:72%">≈ 30 %</span>' +
      '</div><div class="scale-ends"><span>c’est sûr</span><span>peu probable</span></div>' +
      '<p class="small">Sûrement <b>pas</b> : <i>It must not be serious</i> (ou <i>It can’t be serious</i>). Au passé : + <b>HAVE + participe passé</b> : <i>He must have forgotten · She may have gone home · It might have been a shadow.</i></p>' +
    '</div>' +
    '<div class="pair"><div class="vs bad"><span class="k">MUSTN’T</span><span>= c’est <b>interdit</b></span><span class="ex-line">You mustn’t smoke in the clinic.</span></div>' +
    '<div class="vs good"><span class="k">DON’T HAVE TO</span><span>= tu n’es <b>pas obligé</b></span><span class="ex-line">You don’t have to come: the appointment is cancelled.</span></div></div>' +
    tbl(['Présent', 'Passé', 'Futur'], [
      trow(td('<b>MUST</b> / have to', 'w'), td('<b>HAD TO</b>'), td('<b>WILL HAVE TO</b>')),
      trow(td('<b>CAN</b>', 'w'), td('<b>COULD</b> / was able to'), td('<b>WILL BE ABLE TO</b>')),
      trow(td('<b>MAY</b> (permission)', 'w'), td('was allowed to'), td('will be allowed to'))
    ]) +
    '<div class="rule"><span class="k">Modal + HAVE + participe passé</span><ul>' +
      '<li><b>must have</b> + p.p. = a dû (déduction) : <i>He must have forgotten his appointment.</i></li>' +
      '<li><b>may / might have</b> + p.p. = a peut-être : <i>He may have had a reaction to the anesthetic.</i></li>' +
      '<li><b>should have</b> + p.p. = aurait dû (reproche) : <i>You should have called the dentist.</i></li>' +
      '<li><b>could have</b> + p.p. = aurait pu : <i>It could have been worse.</i></li></ul></div></section>';

  h += '<section class="sheet" id="f-qw"><h2>Les interrogatifs <span class="pg">Point 5 · p.84–85</span></h2>' +
    tbl(['Mot', 'Sens', 'Exemple'], QW.map(function (q) {
      return trow(td(esc(q.w), 'w'), td(esc(q.fr) + (q.bonus ? ' <span class="pg">bonus</span>' : '')), td('<i>' + esc(q.ex) + '</i><br><span class="muted small">' + esc(q.exfr) + '</span>'));
    })) +
    '<div class="rule"><span class="k">À retenir</span><ul>' +
      '<li>La <b>préposition va à la fin</b> : <i>Who are you talking TO?</i> (À qui…) · <i>What is this book ABOUT?</i> (De quoi…) · <i>Where do you come FROM?</i> (D’où…) · <i>What are you thinking OF / ABOUT?</i></li>' +
      '<li><b>WHO</b> = personnes · <b>WHICH</b> = choses, ou choix dans un groupe limité · <b>WHAT</b> + nom = quel(le) : <i>What time is it?</i></li>' +
      '<li><b>WHOSE + nom</b> : <i>Whose X-ray is this?</i> = À qui est cette radio ? (jamais <i>who’s</i>).</li>' +
      '<li><b>HOW + adjectif</b> = combien, à quel point : <i>How tall are you? · How big is the abscess?</i></li>' +
      '<li><b>HOW LONG</b> + present perfect pour « depuis combien de temps » : <i>How long have you had this pain?</i></li></ul></div></section>';

  h += '<section class="sheet" id="f-dis"><h2>Maladies <span class="pg">p.25–27</span></h2>' +
    tbl(['Maladie', 'Signes et symptômes', 'Type', 'Français'], DISEASES.map(function (x) { return trow(td(esc(x.name), 'w'), td(esc(x.d)), td(esc(x.type)), td(esc(x.fr))); })) + '</section>';

  h += '<section class="sheet" id="f-voc"><h2>Vocabulaire des symptômes <span class="pg">p.25–28</span></h2>' +
    tbl(['Mot', 'Français', 'Définition'], VOC.map(function (x) { return trow(td(esc(x.w), 'w'), td(esc(x.fr)), td(esc(x.d.replace(/_{3,}/g, '…')) + ' <span class="pg">' + esc(x.src) + '</span>')); })) + '</section>';

  h += '<section class="sheet" id="f-eq"><h2>Bactérienne ou virale · courant ↔ scientifique <span class="pg">p.28–29</span></h2>' +
    '<p><b>Bactériennes</b> : ' + BV.filter(function (x) { return x.a === 'B'; }).map(function (x) { return esc(x.w) + ' <span class="muted">(' + esc(x.fr) + ')</span>'; }).join(', ') + '.</p>' +
    '<p><b>Virales</b> : ' + BV.filter(function (x) { return x.a === 'V'; }).map(function (x) { return esc(x.w) + ' <span class="muted">(' + esc(x.fr) + ')</span>'; }).join(', ') + '.</p>' +
    tbl(['Nom courant', 'Nom scientifique', 'Français'], EQUIV.map(function (x) { return trow(td(esc(x.c), 'w'), td(esc(x.s), 'w'), td(esc(x.fr) + ' <span class="pg">' + esc(x.src) + '</span>')); })) +
    '<h3>Bonus</h3>' +
    tbl(['Courant', 'Scientifique', 'Français'], EQUIV_BONUS.map(function (x) { return trow(td(esc(x.c)), td(esc(x.s), 'w'), td(esc(x.fr) + ' <span class="pg">' + esc(x.src) + '</span>')); })) + '</section>';

  h += '<section class="sheet" id="f-drug"><h2>Médicaments <span class="pg">p.29–30</span></h2>' +
    '<h3>Vrai ou faux ?</h3>' +
    tbl(['Affirmation', 'Réponse'], TF.map(function (x) { return trow(td(esc(x.s) + '<br><span class="muted small">' + esc(x.why) + '</span>'), td('<span class="tf ' + (x.a ? 't">VRAI' : 'f">FAUX') + '</span>')); })) +
    '<h3>Formes</h3>' +
    tbl(['Anglais', 'Français', 'Définition'], FORMS.map(function (x) { return trow(td(esc(x.w), 'w'), td(esc(x.fr)), td(esc(x.d))); })) +
    '<h3>Types</h3>' +
    tbl(['Anglais', 'Français', 'Rôle'], TYPES.map(function (x) { return trow(td(esc(x.w), 'w'), td(esc(x.fr)), td(esc(x.d))); })) +
    '<h3>Mots du texte</h3>' +
    tbl(['Français', 'Anglais', 'À savoir'], DRUGVOC.map(function (x) { return trow(td(esc(x.fr)), td(esc(x.en), 'w'), td(esc(x.note || ''), 'small')); })) + '</section>';

  h += '<section class="sheet" id="f-oral"><h2>La bouche et les dents <span class="pg">p.31–34</span></h2>' +
    tbl(['Anglais', 'Français', 'Précision'], ORAL.map(function (x) { return trow(td(esc(x.w), 'w'), td(esc(x.fr)), td(esc(x.d || x.note || (x.alt.length ? 'Aussi : ' + x.alt.join(', ') : '')) + ' <span class="pg">' + esc(x.src) + '</span>')); })) +
    '<h3>Corrigé de l’appariement <span class="pg">p.33</span></h3>' +
    tbl(['N°', 'Mot', 'Définition', 'Lettre'], MATCH33.map(function (x) { return trow(td(String(x.n), 'end'), td(esc(x.w) + ' <span class="muted small">(' + esc(x.fr) + ')</span>', 'w'), td(esc(x.d)), td(esc(x.l), 'end')); })) + '</section>';

  h += '<section class="sheet" id="f-dent"><h2>Vocabulaire dentaire A → V <span class="pg">p.35</span></h2>' +
    '<p class="small muted">Le poly donne seulement les mots : ces définitions sont des définitions types, pour t’entraîner à l’exercice « définition → mot ».</p>' +
    tbl(['', 'Mot', 'Français', 'Définition'], DENTVOC.map(function (x) { return trow(td(esc(x.k), 'end'), td(esc(x.w), 'w'), td(esc(x.fr)), td(esc(x.d))); })) + '</section>';

  h += '<section class="sheet" id="f-plu"><h2>Pluriels irréguliers <span class="pg">p.25–34 + rappels</span></h2>' +
    tbl(['Règle', 'Exemple'], RULES.map(function (r) { return trow(td(esc(r.s + ' → ' + r.p), 'end'), td('<span class="mono">' + esc(r.ex) + '</span>')); })) +
    tbl(['Singulier', 'Pluriel', 'Règle'], PLURALS.map(function (p) { return trow(td(esc(p.s), 'w'), td('<b>' + esc(p.p) + '</b>' + (p.alt ? ' <span class="muted small">(ou ' + esc(p.alt.join(', ')) + ')</span>' : '')), td(esc(p.r) + (p.note ? ' · ' + esc(p.note) : ''))); })) +
    '<p class="small muted">Rappels p.20–21 : ' + PLURALS_REVIEW.map(function (p) { return esc(p.s) + ' → <b>' + esc(p.p) + '</b>'; }).join(' · ') + '.</p></section>';

  $('#fichesBody').innerHTML = h;
}

</script>
